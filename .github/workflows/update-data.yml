name: Update sauna database and deploy

on:
  workflow_dispatch:
  schedule:
    - cron: '23 9 * * 1'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sauna-data-update
  cancel-in-progress: false

jobs:
  update-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install updater dependencies
        run: pip install -r requirements.txt
      - name: Refresh sauna catalog and specifications
        run: python scripts/update_database.py
      - name: Commit refreshed data
        run: |
          git config user.name "infinite-sauna-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data models brands comparisons sitemap.xml
          if git diff --cached --quiet; then
            echo "No database changes to commit."
          else
            git commit -m "Refresh sauna database"
            git push
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload refreshed site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy refreshed site
        id: deployment
        uses: actions/deploy-pages@v4
